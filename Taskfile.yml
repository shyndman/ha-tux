version: '3'

vars:
  PROJECT_DIR: '{{.TASKFILE_DIR}}'
  SYSTEM_SYSTEMD_DIR: /etc/systemd/system
  SESSION_UNIT: ha-tux-session.service
  HOST_UNIT: ha-tux-host.service
  UPDATE_UNIT: ha-tux-updates.service
  UPDATE_HOME: /var/lib/ha-tux-updates
  OPT_DIR: /opt/ha-tux
  HOST_USER: ha-tux
  HOST_HOME: /var/lib/ha-tux
  APT_UPGRADE_UNIT: ha-tux-apt-upgrade.service
  BREW_UPGRADE_UNIT: ha-tux-brew-upgrade.service
  POLKIT_RULES_DIR: /etc/polkit-1/rules.d
  POLKIT_RULE: 49-ha-tux-apt-upgrade.rules
  BREW_POLKIT_RULE: 49-ha-tux-brew-upgrade.rules
  SMART_SCAN_UNIT: ha-tux-smart.service
  SMART_TIMER_UNIT: ha-tux-smart.timer

tasks:
  install:
    desc: Install and start the services
    cmds:
      # Retire the old single deployments (clean cutover).
      - systemctl --user disable --now ha-tux.service 2>/dev/null || true
      - rm -f "{{.HOME}}/.config/systemd/user/ha-tux.service"
      - systemctl --user daemon-reload || true
      - sudo systemctl disable --now ha-tux.service 2>/dev/null || true
      - sudo rm -f "{{.SYSTEM_SYSTEMD_DIR}}/ha-tux.service"
      # Locked-down service user for the host role.
      - getent passwd {{.HOST_USER}} >/dev/null || sudo useradd --system --create-home --home-dir {{.HOST_HOME}} --shell /usr/sbin/nologin {{.HOST_USER}}
      # Seed the host config and the update service state.
      - sudo install -d -o {{.HOST_USER}} -g {{.HOST_USER}} -m 0750 {{.HOST_HOME}}/.config/ha-tux
      - if test -f "{{.HOME}}/.config/ha-tux/config.toml"; then sudo install -o {{.HOST_USER}} -g {{.HOST_USER}} -m 0640 "{{.HOME}}/.config/ha-tux/config.toml" {{.HOST_HOME}}/.config/ha-tux/config.toml; fi
      - sudo install -d -o "$(id -un)" -g "$(id -gn)" -m 0750 {{.UPDATE_HOME}}/.config/ha-tux {{.UPDATE_HOME}}/.local/state/ha-tux
      - if test -f "{{.HOME}}/.config/ha-tux/config.toml"; then sudo install -o "$(id -un)" -g "$(id -gn)" -m 0640 "{{.HOME}}/.config/ha-tux/config.toml" {{.UPDATE_HOME}}/.config/ha-tux/config.toml; fi
      - if ! sudo test -f "{{.UPDATE_HOME}}/.local/state/ha-tux/state.toml" && test -f "{{.HOME}}/.local/state/ha-tux/state.toml"; then sudo install -o "$(id -un)" -g "$(id -gn)" -m 0640 "{{.HOME}}/.local/state/ha-tux/state.toml" {{.UPDATE_HOME}}/.local/state/ha-tux/state.toml; fi
      # Self-contained /opt venv: uv-managed 3.13 interpreter AND the venv both under /opt.
      - test -d {{.OPT_DIR}} || sudo install -d -o "$(id -un)" -g "$(id -gn)" {{.OPT_DIR}}
      - UV_PYTHON_INSTALL_DIR={{.OPT_DIR}}/python uv python install 3.13
      - UV_PYTHON_INSTALL_DIR={{.OPT_DIR}}/python UV_PROJECT_ENVIRONMENT={{.OPT_DIR}}/venv uv sync --no-dev --no-editable --frozen --reinstall-package ha-tux --python-preference only-managed --python 3.13
      # Install and start the services.
      - sudo install -m 0644 "systemd/{{.SESSION_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.SESSION_UNIT}}"
      - sudo install -m 0644 "systemd/{{.HOST_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.HOST_UNIT}}"
      - sudo install -m 0644 "systemd/{{.UPDATE_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.UPDATE_UNIT}}"
      - sudo install -m 0644 "systemd/{{.APT_UPGRADE_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.APT_UPGRADE_UNIT}}"
      - sudo install -m 0644 "systemd/{{.BREW_UPGRADE_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.BREW_UPGRADE_UNIT}}"
      - sudo install -m 0644 "polkit/{{.POLKIT_RULE}}" "{{.POLKIT_RULES_DIR}}/{{.POLKIT_RULE}}"
      - sudo install -m 0644 "polkit/{{.BREW_POLKIT_RULE}}" "{{.POLKIT_RULES_DIR}}/{{.BREW_POLKIT_RULE}}"
      - sudo install -m 0644 "systemd/{{.SMART_SCAN_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.SMART_SCAN_UNIT}}"
      - sudo install -m 0644 "systemd/{{.SMART_TIMER_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.SMART_TIMER_UNIT}}"
      - sudo systemctl daemon-reload
      - sudo systemctl enable --now {{.SMART_TIMER_UNIT}}
      - sudo systemctl start {{.SMART_SCAN_UNIT}}
      - sudo systemctl enable {{.SESSION_UNIT}} {{.HOST_UNIT}} {{.UPDATE_UNIT}}
      - sudo systemctl restart {{.SESSION_UNIT}} {{.HOST_UNIT}} {{.UPDATE_UNIT}}

  uninstall:
    desc: Stop and remove the services
    cmds:
      - sudo systemctl disable --now {{.SESSION_UNIT}} {{.HOST_UNIT}} {{.UPDATE_UNIT}} || true
      - sudo systemctl disable --now {{.SMART_TIMER_UNIT}} || true
      - sudo rm -f "{{.SYSTEM_SYSTEMD_DIR}}/{{.SESSION_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.HOST_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.UPDATE_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.APT_UPGRADE_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.BREW_UPGRADE_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.SMART_SCAN_UNIT}}" "{{.SYSTEM_SYSTEMD_DIR}}/{{.SMART_TIMER_UNIT}}"
      - sudo rm -f "{{.POLKIT_RULES_DIR}}/{{.POLKIT_RULE}}" "{{.POLKIT_RULES_DIR}}/{{.BREW_POLKIT_RULE}}"
      - sudo systemctl daemon-reload

  logs:
    desc: Display the service logs
    cmds:
      - journalctl -o cat --no-pager -u {{.SESSION_UNIT}} -u {{.HOST_UNIT}} -u {{.UPDATE_UNIT}} {{.CLI_ARGS}}
